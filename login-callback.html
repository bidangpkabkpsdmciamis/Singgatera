<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Callback - SINGGATERA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            padding: 20px;
        }
        .callback-container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .icon.success {
            color: #22c55e;
        }
        .icon.error {
            color: #ef4444;
        }
        .icon.loading {
            color: #6e8efb;
        }
        .callback-container h2 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .callback-container p {
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .callback-container .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .callback-container .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
        }
        .callback-container .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }
        .callback-container .btn-secondary:hover {
            background: #cbd5e1;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: #6e8efb;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .user-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
        .user-info .label {
            color: #64748b;
            font-size: 0.85rem;
        }
        .user-info .value {
            font-weight: 600;
            color: #1e293b;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn-group .btn {
            flex: 1;
            min-width: 120px;
        }
        @media (max-width: 480px) {
            .callback-container {
                padding: 30px 20px;
            }
            .btn-group .btn {
                flex: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="callback-container" id="callbackContainer">
        <div id="loadingState">
            <div class="spinner"></div>
            <h2>Memproses Login...</h2>
            <p>Mohon tunggu sebentar, sedang memverifikasi akun Anda.</p>
        </div>
        
        <div id="successState" style="display:none;">
            <div class="icon success"><i class="fas fa-check-circle"></i></div>
            <h2>✅ Login Berhasil!</h2>
            <p id="successMessage">Selamat datang kembali!</p>
            <div class="user-info" id="userInfo">
                <div><span class="label">Nama:</span> <span class="value" id="userName">-</span></div>
                <div><span class="label">NIP:</span> <span class="value" id="userNIP">-</span></div>
            </div>
            <div class="btn-group">
                <a href="index.html" class="btn"><i class="fas fa-home"></i> Ke Beranda</a>
                <a href="https://www.profile.singgatera.my.id/" class="btn btn-secondary"><i class="fas fa-user"></i> Profil Saya</a>
            </div>
        </div>
        
        <div id="errorState" style="display:none;">
            <div class="icon error"><i class="fas fa-times-circle"></i></div>
            <h2>❌ Login Gagal</h2>
            <p id="errorMessage">Terjadi kesalahan saat login. Silakan coba lagi.</p>
            <div class="btn-group">
                <a href="login.html" class="btn"><i class="fas fa-arrow-left"></i> Kembali Login</a>
                <a href="index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Ke Beranda</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ===== AMBIL PARAMETER URL =====
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const name = urlParams.get('name');
            const username = urlParams.get('username');
            const message = urlParams.get('message') || '';
            
            console.log('[Callback] 📥 Params:', { status, name, username, message });
            
            // ===== ELEMEN =====
            const loadingState = document.getElementById('loadingState');
            const successState = document.getElementById('successState');
            const errorState = document.getElementById('errorState');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const userName = document.getElementById('userName');
            const userNIP = document.getElementById('userNIP');
            
            // ===== FUNGSI COOKIE =====
            function setCookie(name, value, days = 1) {
                const expires = new Date();
                expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
                const encodedValue = typeof value === 'string' ? 
                    encodeURIComponent(value) : 
                    encodeURIComponent(JSON.stringify(value));
                document.cookie = `${name}=${encodedValue}; expires=${expires.toUTCString()}; path=/; domain=.singgatera.my.id; SameSite=Lax; Secure`;
                document.cookie = `${name}=${encodedValue}; expires=${expires.toUTCString()}; path=/; SameSite=Lax; Secure`;
                console.log(`[Callback] ✅ Cookie "${name}" diset`);
            }
            
            // ===== PROSES =====
            setTimeout(() => {
                // Sembunyikan loading
                loadingState.style.display = 'none';
                
                if (status === 'success' && username) {
                    // ===== LOGIN SUKSES =====
                    console.log('[Callback] ✅ Login sukses untuk:', name);
                    
                    const loginData = {
                        name: name || username,
                        username: username,
                        email: username + '@ciamiskab.go.id',
                        loginTime: new Date().toISOString(),
                        foto: ''
                    };
                    
                    // Simpan ke localStorage
                    localStorage.setItem("loginData", JSON.stringify(loginData));
                    
                    // Simpan ke cookie
                    setCookie('loginData', loginData, 1);
                    
                    // Tampilkan sukses
                    successState.style.display = 'block';
                    successMessage.textContent = `Selamat datang, ${loginData.name}!`;
                    userName.textContent = loginData.name;
                    userNIP.textContent = loginData.username;
                    
                } else {
                    // ===== LOGIN GAGAL =====
                    console.log('[Callback] ❌ Login gagal:', message);
                    
                    errorState.style.display = 'block';
                    errorMessage.textContent = message || 'Username atau password salah. Silakan coba lagi.';
                }
                
                // Hapus parameter URL
                const cleanUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
                
            }, 1500); // Tunggu 1.5 detik untuk efek loading
            
        })();
    </script>
</body>
</html>
